openapi: 3.0.0
info:
  title: CAB System - Notification API
  description: API quản lý thông báo
  version: 1.0.0
servers:
  - url: https://api.cab-system.com/v1
    description: Production server

paths:
  /notifications:
    get:
      tags:
        - Notification
      summary: Lấy danh sách thông báo
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: isRead
          in: query
          schema:
            type: boolean
          description: Lọc theo trạng thái đã đọc hay chưa
      responses:
        '200':
          description: Danh sách thông báo

  /notifications/{notificationId}/read:
    patch:
      tags:
        - Notification
      summary: Đánh dấu đã đọc thông báo
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cập nhật thành công

  /notifications/read-all:
    patch:
      tags:
        - Notification
      summary: Đánh dấu tất cả đã đọc
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cập nhật thành công

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer