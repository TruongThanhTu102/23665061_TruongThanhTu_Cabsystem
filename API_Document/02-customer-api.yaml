openapi: 3.0.0
info:
  title: CAB System - Customer API
  description: API quản lý khách hàng - Thông tin, lịch sử chuyến đi
  version: 1.0.0
servers:
  - url: https://api.cab-system.com/v1
    description: Production server

paths:
  /customers/profile:
    get:
      tags:
        - Customer
      summary: Lấy thông tin khách hàng
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: integer
                    format: int64
                  fullName:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
                  address:
                    type: string
                  createdAt:
                    type: string
                    format: date-time

    put:
      tags:
        - Customer
      summary: Cập nhật thông tin khách hàng
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                address:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công

  /customers/trips/history:
    get:
      tags:
        - Customer
      summary: Lịch sử chuyến đi
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum:
              - COMPLETED
              - CANCELLED
              - ALL
            default: ALL
      responses:
        '200':
          description: Danh sách lịch sử chuyến đi

  /customers/trips/{tripId}:
    get:
      tags:
        - Customer
      summary: Chi tiết chuyến đi
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thông tin chi tiết chuyến đi

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer